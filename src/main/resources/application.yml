server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: secure-auth-system

  # Default to H2 in-memory DB for local development/testing
  datasource:
    url: jdbc:h2:mem:bank_auth_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

# JWT configuration (Paths left empty in dev so JwtTokenProvider generates ephemeral 4096-bit RSA keys automatically)
jwt:
  private-key-path: ""
  public-key-path: ""

logging:
  level:
    root: INFO
    com.bank.auth: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
